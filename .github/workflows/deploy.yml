name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AESOP_REPO: ${{ github.workspace }}/aesop
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
      - name: Checkout aesop repository
        uses: actions/checkout@v4
        with:
          repository: matt82198/aesop
          path: aesop
          fetch-depth: 0
          filter: blob:none
      - name: Sync aesop stats
        run: python scripts/sync-aesop-stats.py ./aesop
      - name: Show refreshed stats
        run: cat src/data/aesop-stats.json
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # Carlito is metric-compatible with Calibri (the resume's print font)
      # and the postbuild step's Playwright-rendered PDF needs a real
      # Chromium browser -- both are required before `npm run build`
      # triggers the postbuild resume-PDF generation.
      - name: Install Carlito font (Calibri-compatible, for the resume PDF)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check numeric sources (strict)
        run: npm run lint:sources

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
